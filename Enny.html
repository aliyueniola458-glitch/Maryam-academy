<!DOCTYPE html>
<html>
    <head>
      <title>Registration Form</title>
    </head>
    <body>
    <h1>STUDENT'S REGISTRATION FORM</h1>
  <form "https://formspree.io/forms/xzdnqgrd/integration" method="POST">
    <label><b>Full Name:</b></label><br>
    <input type="text" placeholder="Enter your full name" name="Full_name"><br><br>
    <label><b>Email:</b></label><br>       
   <input type="email" placeholder="Enter your Email" name="email"><br><br>
    <label><b>Password:</b></label><br>
    <input type="password" placeholder="*********" name="password"><br><br>
    <label><b>Gender:</b></label><br>
    <input type="radio" name="gender" value="female"><b>Female</b>
    <input type="radio" name="gender" value="male"><b>Male</b><br>
    <label><b>Skills:</b></label><br>
    <input type="checkbox" name="Skills"value="Graphic_design"><strong>Graphic design</strong><br>
    <input type="checkbox" name="Skills"value="Carpentry"><strong>Carpentry<strong><br>
    <input type="checkbox"name="Skills"value="Mechanic"><strong>Mechanic</strong><br>
    <input type="checkbox" name="Skills"value="Hairdressing"><strong>Hairdressing</strong><br>
    <input type="checkbox" name="skills"value="Website training"><strong>Website training</strong><br><br>
    <label><b>Message:</b></label><br>
    <textarea type="text" placeholder="enter your message"></textarea><br><br>
    Click here to submit👇👇<br>
    <button type="submit"><b>Submit</b></button>
  </form>
  </body>
</html>
